# Secret scan on every commit. Direct response to a live Supabase Postgres
# connection string (host, user, password, db) having been pasted in
# plaintext into a shell command during a debugging session -- this exists
# so a credential in a diff is a blocked commit, not a rotation email later.
#
# Setup (once per clone):
#   pip install pre-commit
#   pre-commit install
#
# Runs automatically on `git commit` from then on. Run it on demand with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
